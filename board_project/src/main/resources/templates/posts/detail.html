<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        main { max-width: 760px; margin: 56px auto; padding: 28px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
        h1 { margin: 0 0 12px; font-size: 26px; }
        .meta { margin-bottom: 24px; color: #666; font-size: 14px; }
        .content { min-height: 220px; padding: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; white-space: pre-wrap; line-height: 1.6; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .button, button { display: inline-block; padding: 10px 14px; border: 0; border-radius: 6px; background: #222; color: #fff; font-size: 14px; text-decoration: none; cursor: pointer; }
        .secondary { background: #777; }
        .danger { background: #c62828; }
        form { margin: 0; }
    </style>
</head>
<body>
<main>
    <h1 th:text="${post.title()}">제목</h1>
    <div class="meta">
        <span th:text="${post.authorName()}">작성자</span>
        <span> | </span>
        <span th:text="${#temporals.format(post.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-07-07 18:00</span>
    </div>

    <div class="content" th:text="${post.content()}">내용</div>

    <div class="actions">
        <a class="button secondary" th:href="@{/main}">목록</a>
        <a class="button" th:href="@{/posts/{postId}/edit(postId=${post.id()})}">수정</a>
        <form th:action="@{/posts/{postId}/delete(postId=${post.id()})}" method="post">
            <button class="danger" type="submit">삭제</button>
        </form>
    </div>
</main>
</body>
</html>
