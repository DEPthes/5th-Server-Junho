<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        main {
            max-width: 420px;
            margin: 56px auto;
            padding: 28px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            margin-bottom: 8px;
            padding: 0 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        .field {
            margin-bottom: 16px;
        }

        .error {
            margin: 0;
            color: #c62828;
            font-size: 14px;
        }

        .success {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #1b5e20;
        }

        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <h1>회원가입</h1>

    <div class="success" th:if="${joined}">회원가입이 완료되었습니다.</div>

    <form th:action="@{/members}" th:object="${memberCreateRequest}" method="post">
        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>

        <div class="field">
            <label for="username">사용자 이름</label>
            <input id="username" type="text" th:field="*{username}">
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" th:field="*{password}">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" th:field="*{email}">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <button type="submit">가입하기</button>
    </form>
</main>
</body>
</html>
