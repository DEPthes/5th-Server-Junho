<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        main {
            max-width: 420px;
            margin: 56px auto;
            padding: 28px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            margin-bottom: 8px;
            padding: 0 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        .field {
            margin-bottom: 16px;
        }

        .password-row {
            display: flex;
            gap: 8px;
        }

        .password-row input {
            margin-bottom: 8px;
        }

        .error {
            margin: 0 0 12px;
            color: #c62828;
            font-size: 14px;
        }

        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .toggle-password {
            width: 76px;
            height: 42px;
            flex: 0 0 76px;
            font-size: 14px;
            background: #666;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            color: #222;
        }
    </style>
</head>
<body>
<main>
    <h1>로그인</h1>

    <form th:action="@{/members/login}" th:object="${memberLoginRequest}" method="post">
        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>

        <div class="field">
            <label for="username">사용자 이름</label>
            <input id="username" type="text" th:field="*{username}">
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <div class="password-row">
                <input id="password" type="text" th:field="*{password}">
                <button class="toggle-password" type="button" onclick="togglePasswordVisibility('password', this)">숨기기</button>
            </div>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit">로그인</button>
    </form>

    <a th:href="@{/members/new}">회원가입</a>
</main>
<script>
    function togglePasswordVisibility(inputId, button) {
        const passwordInput = document.getElementById(inputId);
        const isVisible = passwordInput.type === 'text';

        passwordInput.type = isVisible ? 'password' : 'text';
        button.textContent = isVisible ? '보기' : '숨기기';
    }
</script>
</body>
</html>
