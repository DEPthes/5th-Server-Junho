<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 메인</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        header { border-bottom: 1px solid #ddd; background: #fff; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 960px; margin: 0 auto; padding: 18px 24px; }
        h1 { margin: 0; font-size: 24px; }
        main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        h2 { margin: 0; font-size: 20px; }
        .button, button { display: inline-block; padding: 10px 14px; border: 0; border-radius: 6px; background: #222; color: #fff; font-size: 14px; text-decoration: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ddd; }
        th, td { padding: 14px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #fafafa; font-weight: 700; }
        td a { color: #222; text-decoration: none; font-weight: 700; }
        td a:hover { text-decoration: underline; }
        .empty { padding: 48px 16px; text-align: center; color: #666; }
        .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 20px; }
        .pagination a, .pagination span { min-width: 36px; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #222; text-align: center; text-decoration: none; font-size: 14px; }
        .pagination .active { background: #222; color: #fff; border-color: #222; }
        .pagination .disabled { color: #aaa; background: #f5f5f5; }
        form { margin: 0; }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <h1>Board</h1>
        <form th:action="@{/members/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</header>

<main>
    <div class="toolbar">
        <h2>게시글 목록</h2>
        <a class="button" th:href="@{/posts/new}">글쓰기</a>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width: 80px;">번호</th>
            <th>제목</th>
            <th style="width: 140px;">작성자</th>
            <th style="width: 180px;">작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${postPage.empty}">
            <td colspan="4" class="empty">아직 등록된 게시글이 없습니다.</td>
        </tr>
        <tr th:each="post : ${postPage.content}">
            <td th:text="${post.id()}">1</td>
            <td>
                <a th:href="@{/posts/{postId}(postId=${post.id()})}" th:text="${post.title()}">제목</a>
            </td>
            <td th:text="${post.authorName()}">작성자</td>
            <td th:text="${#temporals.format(post.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-07-07 18:00</td>
        </tr>
        </tbody>
    </table>

    <nav class="pagination" th:if="${postPage.totalPages > 0}">
        <a th:if="${postPage.hasPrevious()}" th:href="@{/main(page=${postPage.number - 1})}">이전</a>
        <span class="disabled" th:unless="${postPage.hasPrevious()}">이전</span>

        <a th:each="pageNumber : ${#numbers.sequence(0, postPage.totalPages - 1)}"
           th:href="@{/main(page=${pageNumber})}"
           th:text="${pageNumber + 1}"
           th:classappend="${pageNumber == postPage.number} ? 'active' : ''">1</a>

        <a th:if="${postPage.hasNext()}" th:href="@{/main(page=${postPage.number + 1})}">다음</a>
        <span class="disabled" th:unless="${postPage.hasNext()}">다음</span>
    </nav>
</main>
</body>
</html>
